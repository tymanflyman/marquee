<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0716">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marquee">
  <title>Marquee</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>html{background:#0b0716}</style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aura" aria-hidden="true"></div>

  <!-- sign in -->
  <section id="login" class="hidden">
    <div class="login-card glass">
      <img src="/icon.svg" alt="" width="64" height="64">
      <h1>Marquee</h1>
      <p class="muted" id="login-server">Connecting to Jellyfin&hellip;</p>
      <div id="login-users" class="login-users"></div>
      <form id="login-form" autocomplete="on">
        <input id="login-name" name="username" placeholder="Username" autocomplete="username" autocapitalize="off" required>
        <input id="login-pw" name="password" type="password" placeholder="Password" autocomplete="current-password">
        <button class="btn primary" type="submit">Sign in</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>
  </section>

  <!-- main app -->
  <header id="topbar" class="hidden">
    <a href="#/" class="brand" aria-label="Home"><img src="/icon.svg" alt="" width="30" height="30"><span>Marquee</span></a>
    <nav id="nav" class="nav"></nav>
    <div class="top-actions">
      <a href="#/search" class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></a>
      <button class="icon-btn" id="user-btn" aria-label="Account"><span id="user-initial">?</span></button>
    </div>
  </header>
  <div id="user-menu" class="menu glass hidden">
    <div class="menu-head" id="user-name"></div>
    <button id="sign-out">Sign out</button>
  </div>

  <main id="view"></main>

  <nav id="tabbar" class="tabbar hidden"></nav>

  <!-- player -->
  <section id="player" class="hidden" aria-label="Player">
    <video id="video" playsinline preload="auto"></video>
    <div class="p-spinner" id="p-spinner"><i></i></div>
    <div class="p-ui" id="p-ui">
      <div class="p-top">
        <button class="icon-btn" id="p-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="p-title"><b id="p-title"></b><small id="p-sub"></small></div>
        <button class="icon-btn" id="p-settings" aria-label="Audio, subtitles and quality"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 13h4M13 13h4M7 16h7"/></svg></button>
      </div>
      <div class="p-center">
        <button class="icon-btn big" id="p-rew" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/><text x="12" y="15.5" text-anchor="middle">10</text></svg></button>
        <button class="icon-btn huge" id="p-play" aria-label="Play or pause"><svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l13-7.5z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5v14M16 5v14"/></svg></button>
        <button class="icon-btn big" id="p-fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5"/><path d="M20 4v4.5h-4.5"/><text x="12" y="15.5" text-anchor="middle">30</text></svg></button>
      </div>
      <div class="p-bottom">
        <div class="p-bar" id="p-bar" tabindex="0" role="slider" aria-label="Seek">
          <div class="p-track"><i class="p-buf" id="p-buf"></i><i class="p-fill" id="p-fill"></i><b class="p-knob" id="p-knob"></b></div>
          <span class="p-hover" id="p-hover"></span>
        </div>
        <div class="p-row">
          <span id="p-time">0:00</span>
          <span class="p-mode" id="p-mode"></span>
          <span id="p-left">-0:00</span>
          <button class="icon-btn" id="p-next" aria-label="Next episode" hidden><svg viewBox="0 0 24 24"><path d="M5 5v14l10-7zM19 5v14"/></svg></button>
          <button class="icon-btn" id="p-full" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </div>
    <div id="p-sheet" class="sheet glass hidden"></div>
    <div id="p-upnext" class="upnext glass hidden"></div>
  </section>

  <div id="toast" class="toast glass hidden"></div>

  <script src="/vendor/hls.min.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
